<!DOCTYPE html>
<html lang="en">
<head>

    <title>Abdul Wasay | Web Developer & Tech Explorer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        h1 {
            color: #38bdf8;
            margin-top: 15px;
            font-size: 2rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 5px;
        }

        .section {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.3rem;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .description {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }

        .skills-list li {
            background: #0f172a;
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid #38bdf8;
        }

        .project-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #38bdf8;
        }

        .project-card h3 {
            color: #f8fafc;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .project-card p {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 10px;
        }

        .btn-link {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-social {
            background: #38bdf8;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            text-align: center;
            flex: 1;
        }

        .btn-social:hover {
            background: #7dd3fc;
        }
    </style>
</head>
