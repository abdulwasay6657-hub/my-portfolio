<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abdul Wasay | Web Developer & Tech Enthusiast</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38bdf8;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    h1 {
      font-size: 2rem;
      color: #38bdf8;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-top: 5px;
    }

    .section {
      margin-top: 25px;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 12px;
      font-size: 1.3rem;
      border-bottom: 2px solid #334155;
      padding-bottom: 5px;
    }

    p.description {
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* Skills Badges */
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .skill-tag {
      background: #1e293b;
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #38bdf8;
      transition: all 0.3s ease;
    }

    .skill-tag:hover {
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .project-card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
    }

    .project-card h3 {
      color: #f1f5f9;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .project-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* Social Buttons */
    .social-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .social-btn {
      display: inline-block;
      text-decoration: none;
      color: #f8fafc;
      background: #0284c7;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .social-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
